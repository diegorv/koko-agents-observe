name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Advisories are published independently of code changes, so a new one
      # shouldn't block unrelated pushes/PRs: there the audit steps are
      # report-only. Only the weekly scheduled run fails on findings.
      #
      # Run audit in each workspace that owns its own lockfile. The root
      # has no committed lockfile (its deps are dev-only and installed ad
      # hoc), so there is nothing reproducible to audit there.
      - name: Audit server dependencies
        run: cd app/server && npm audit --audit-level=moderate
        continue-on-error: ${{ github.event_name != 'schedule' }}

      - name: Audit client dependencies
        run: cd app/client && npm audit --audit-level=moderate
        continue-on-error: ${{ github.event_name != 'schedule' }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
